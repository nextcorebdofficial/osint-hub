<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} - OSINT Hub by {{ brand }}</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#7c3aed">
<style nonce="{{ nonce }}">
  :root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5d6672;--line:#dde1e6;--accent:#7c3aed;--bad:#cf222e;--warn:#9a6700}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--line:#2b323b;--accent:#a78bfa;--bad:#f85149;--warn:#d29922}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;padding:16px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(420px,100%)}
  .brand{font-size:12px;color:var(--muted);margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase}
  h1{margin:0 0 4px;font-size:20px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
  label.f{display:block;font-size:13px;margin-bottom:4px}
  textarea,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:var(--card);color:var(--text)}
  textarea{min-height:130px;resize:vertical}
  .hp{position:absolute;left:-9999px;height:0;overflow:hidden}
  input,button{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:var(--card);color:var(--text)}
  button{background:var(--btn);border-color:var(--btn);color:#fff;cursor:pointer;margin-bottom:0}
  button:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--bad);margin:0 0 12px}
  .warn{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px}
  .hint{font-size:12px;color:var(--muted);margin:-6px 0 12px}
  .alt{margin:14px 0 0;font-size:13px;color:var(--muted);text-align:center}
  a{color:var(--accent)}
  .chk{display:flex;gap:8px;font-size:13px;margin-bottom:12px;align-items:flex-start}
  .chk input{width:auto;margin:3px 0 0}
  :root{--btn:#7c3aed}
  button:not(.ghost):not(:disabled):hover,.btn:not(.ghost):hover{background:#6d28d9;border-color:#6d28d9}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type=checkbox]{accent-color:#7c3aed}
  svg.mark{flex:none;display:inline-block;vertical-align:middle}
</style>
</head>
<body>
<div class="box">
  <p class="brand" style="display:flex;align-items:center;gap:8px">{{ logo(26) }} <span>{{ brand }} &middot; OSINT Hub</span></p>
  {% block body %}{% endblock %}
</div>
</body>
</html>
